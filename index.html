<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Bishy Bot</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #1c1c1c;
      color: #f2f2f2;
      padding: 2rem;
      max-width: 800px;
      margin: auto;
    }
    h1 {
      text-align: center;
      color: #ff6b6b;
    }
    #chatbox {
      background: #2e2e2e;
      padding: 1rem;
      border-radius: 8px;
      min-height: 300px;
      overflow-y: auto;
      margin-bottom: 1rem;
    }
    .message {
      margin: 0.5rem 0;
    }
    .user {
      color: #81ecec;
    }
    .bot {
      color: #fab1a0;
    }
    input[type="text"] {
      width: 100%;
      padding: 0.5rem;
      font-size: 1rem;
      border: none;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <h1>Bishy Bot 🤖💢</h1>
  <div id="chatbox"></div>
  <input type="text" id="userInput" placeholder="Ask Bishy Bot something..." />

  <script>
    const chatbox = document.getElementById('chatbox');
    const userInput = document.getElementById('userInput');

    const rudeResponses = [
      "Wow, you're *really* asking that? Bold of you.",
      "Is your brain on vacation again?",
      "You're exhausting, but fine... chicks need heat. Duh.",
      "I'm not your babysitter, but here's the answer anyway.",
      "This again? I thought we covered this... with crayons."
    ];

    function addMessage(text, sender) {
      const message = document.createElement('div');
      message.classList.add('message');
      message.classList.add(sender);
      message.innerText = text;
      chatbox.appendChild(message);
      chatbox.scrollTop = chatbox.scrollHeight;
    }

    userInput.addEventListener('keypress', function (e) {
      if (e.key === 'Enter' && userInput.value.trim() !== '') {
        const userText = userInput.value;
        addMessage(`You: ${userText}`, 'user');
        userInput.value = '';

        // Random snappy response
        const reply = rudeResponses[Math.floor(Math.random() * rudeResponses.length)];
        setTimeout(() => addMessage(`Bishy Bot: ${reply}`, 'bot'), 500);
      }
    });
  </script>
</body>
</html>
